name: Dev 镜像

# 推送到 main（或针对 main 的 PR）时构建 dev 镜像并推送到 ghcr.io。
# 正式版本走 docker-release.yml（推送 v* tag 触发）。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/${{ github.repository_owner }}/fin-news-agent-app
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/fin-news-agent-web

# 同一个分支上连续推送时，取消仍在排队的旧任务，避免重复构建浪费构建时长
concurrency:
  group: docker-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # context 必须与 docker-compose.prod.yml 里原来的 build.context 保持一致
          - name: app
            context: .
          - name: web
            context: ./web

    steps:
      - name: 解析镜像名
        id: image
        run: |
          if [ "${{ matrix.name }}" = "app" ]; then
            echo "name=${APP_IMAGE}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${WEB_IMAGE}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # PR 只验证 Dockerfile 能否构建，不推送镜像，也就不需要登录
      - name: 登录 ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签与 OCI 元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            # dev 是浮动标签，始终指向 main 最新一次构建
            type=raw,value=dev
            # dev-<短 sha> 是固定标签，便于回溯某次提交对应的镜像
            type=sha,prefix=dev-,format=short

      - name: 构建并推送 ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          # PR 场景只构建不推送（无 registry 凭据，push 会失败）
          push: ${{ github.event_name != 'pull_request' }}
          load: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 需要多架构时改成 linux/amd64,linux/arm64，并在此 job 前加上
          # docker/setup-qemu-action@v3（arm64 走 QEMU 模拟，构建耗时会显著变长）
          platforms: linux/amd64
          cache-from: type=gha,scope=dev-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=dev-${{ matrix.name }}

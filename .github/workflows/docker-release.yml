name: Release 镜像

# 推送 v* tag 时构建正式版本镜像并推送到 ghcr.io。
# docker-compose.prod.yml 的镜像版本号由 scripts/release.sh（git release）在发版时同步，
# 不再由 CI 回写（避免机器人提交污染历史）。
#
# 用法：
#   git release v1.2.3
on:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/${{ github.repository_owner }}/fin-news-agent-app
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/fin-news-agent-web

concurrency:
  group: docker-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            context: .
          - name: web
            context: ./web

    steps:
      - name: 解析镜像名
        id: image
        run: |
          if [ "${{ matrix.name }}" = "app" ]; then
            echo "name=${APP_IMAGE}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${WEB_IMAGE}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 多架构构建：arm64 在 amd64 runner 上靠 QEMU 模拟执行（Apple Silicon 拉取需要 arm64）
      - uses: docker/setup-qemu-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签与 OCI 元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            # 版本标签，形如 v1.2.3，与 git tag 完全一致，便于 compose 里回溯
            type=raw,value=${{ github.ref_name }}
            # latest 始终指向最近一次正式发布
            type=raw,value=latest

      - name: 构建并推送 ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=release-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.name }}

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: fin-news-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: finnews
      POSTGRES_PASSWORD: finnews
      POSTGRES_DB: finnews
      TZ: Asia/Shanghai
    ports:
      # 宿主机 5433 -> 容器 5432（避免与本地已有 Postgres 冲突）
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 容器首次启动时初始化扩展
      - ./scripts/initdb:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - timezone=Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finnews -d finnews"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # 后端：API + 调度器 + worker 三合一
  app:
    build: .
    container_name: fin-news-app
    restart: unless-stopped
    env_file: .env
    environment:
      # 容器内通过服务名访问 db，端口是容器内 5432（覆盖 .env 里的 localhost:5433）
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # 前端：nginx 托管静态资源 + /api 反代到 app
  web:
    build: ./web
    container_name: fin-news-web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"

volumes:
  pgdata:

[project]
name = "fin-news-v5"
version = "0.1.0"
description = "财经资讯分析 Agent：解释市场为什么涨跌，并支持持续追问"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # --- web / api ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    # --- storage ---
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    # --- scheduling ---
    "apscheduler>=3.10",
    # --- data source ---
    "tushare>=1.4.21",
    "pandas>=2.0",
    # --- llm / agent ---
    "openai>=1.40",
    "langchain-openai>=0.2",
    "langchain>=1.0",
    "langgraph>=0.2",
    "deepagents>=0.7",
    "langgraph-checkpoint-postgres>=2.0",
    # --- utils ---
    "httpx>=0.27",
    "tenacity>=9.0",
    "structlog>=24.1",
    "tavily-python>=0.8.0",
    "dspy>=3.3.1",
]

# 用 dependency-groups 而不是 optional-dependencies：
# uv 默认同步 dev 组，避免 `uv sync` 把开发依赖裁掉
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
fin-news = "fin_news.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fin_news"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# live：会真实调用外部服务（Tavily 等）、消耗额度，默认跳过
markers = ["live: 需要真实外部服务的端到端用例（默认跳过）"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

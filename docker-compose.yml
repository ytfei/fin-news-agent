services:
  db:
    image: pgvector/pgvector:pg16
    container_name: fin-news-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: finnews
      POSTGRES_PASSWORD: finnews
      POSTGRES_DB: finnews
      TZ: Asia/Shanghai
    ports:
      # 宿主机 5433 -> 容器 5432（避免与本地已有 Postgres 冲突）
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 容器首次启动时初始化扩展
      - ./scripts/initdb:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - timezone=Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finnews -d finnews"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  pgdata:
